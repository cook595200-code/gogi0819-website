<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 주문 - 고기처럼0819</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; color: #333; background-color: #fff; }
        
        /* 헤더 디자인 */
        header { background-color: #f9f9f9; padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee; }
        h1 { margin: 0; color: #d35400; font-size: 1.8em; }
        p.subtitle { margin-top: 10px; color: #666; font-size: 0.9em; }

        /* 메뉴 리스트 디자인 */
        .menu-container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #eee; 
            padding: 20px 0; 
        }
        .menu-info { display: flex; flex-direction: column; flex: 1; padding-right: 10px; }
        .menu-name { font-size: 1.1em; font-weight: bold; margin-bottom: 5px; }
        .menu-desc { font-size: 0.8em; color: #888; word-break: keep-all; }
        .menu-price { font-weight: bold; color: #d35400; font-size: 1.1em; min-width: 70px; text-align: right; }
        
        /* 주문 버튼 디자인 (핵심!) */
        .btn-call {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .btn-call:hover { background-color: #d35400; }

        /* 하단 홈 버튼 */
        .footer-btn { text-align: center; margin: 40px 0; }
        .btn-home { background-color: #eee; color: #333; padding: 10px 20px; text-decoration: none; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🥢 메뉴 주문</h1>
        <p class="subtitle">터치하면 바로 전화로 연결됩니다!</p>
    </header>

    <section class="menu-container">
        
        <div class="menu-item">
            <div class="menu-info">
                <span class="menu-name">꼬들살 (160g)</span>
                <span class="menu-desc">식감이 일품! 씹을수록 고소한 뒷목살</span>
            </div>
            <div style="text-align: right;">
                <div class="menu-price">14,000원</div>
                <a href="tel:02-123-4567" class="btn-call">📞 주문</a>
            </div>
        </div>

        <div class="menu-item">
            <div class="menu-info">
                <span class="menu-name">삼겹살 (160g)</span>
                <span class="menu-desc">육즙 팡팡! 실패 없는 국민 고기</span>
            </div>
            <div style="text-align: right;">
                <div class="menu-price">15,000원</div>
                <a href="tel:02-123-4567" class="btn-call">📞 주문</a>
            </div>
        </div>

        <div class="menu-item">
            <div class="menu-info">
                <span class="menu-name">항정살 (160g)</span>
                <span class="menu-desc">아삭하고 쫄깃한 식감의 정점</span>
            </div>
            <div style="text-align: right;">
                <div class="menu-price">16,000원</div>
                <a href="tel:02-123-4567" class="btn-call">📞 주문</a>
            </div>
        </div>

        <div class="menu-item">
            <div class="menu-info">
                <span class="menu-name">양념갈비 (320g)</span>
                <span class="menu-desc">단짠단짠 끝판왕! 밥도둑 멍석갈비</span>
            </div>
            <div style="text-align: right;">
                <div class="menu-price">16,000원</div>
                <a href="tel:02-123-4567" class="btn-call">📞 주문</a>
            </div>
        </div>

        <div class="menu-item">
            <div class="menu-info">
                <span class="menu-name">오늘의 소고기 (200g)</span>
                <span class="menu-desc">사장님이 엄선한 최상급 소고기</span>
            </div>
            <div style="text-align: right;">
                <div class="menu-price">25,000원</div>
                <a href="tel:02-123-4567" class="btn-call">📞 주문</a>
            </div>
        </div>

        <div class="footer-btn">
            <a href="index.html" class="btn-home">🏠 홈으로 가기</a>
        </div>

    </section>
</body>
</html>
